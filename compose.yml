services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:version-12.1ubu2604
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /docker/volumes/jellyfin/config:/config
      - /docker/volumes/media/finished/shows:/data/shows
      - /docker/volumes/media/finished/movies:/data/movies
      - /docker/volumes/media/finished/music:/data/music
    ports:
      - 8096:8096
      - 8920:8920 #optional
      - 7359:7359/udp #optional
      - 1900:1900/udp #optional
    restart: unless-stopped
    profiles:
      - jellyfin
      - media
  transmission:
    image: lscr.io/linuxserver/transmission:4.1.3
    container_name: transmission
    env_file: .env
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - USER=${TRANSMISSION_USER}
      - PASS=${TRANSMISSION_PASS}
    volumes:
      - /docker/volumes/transmission/config:/config
      - /docker/volumes/media/pending:/downloads/incomplete
      - /docker/volumes/media/finished/movies:/downloads/complete/movies
      - /docker/volumes/media/finished/shows:/downloads/complete/shows
      - /docker/volumes/archive:/downloads/complete/archive
    ports:
      - 9091:9091
      - 51413:51413
      - 51413:51413/udp
    restart: unless-stopped
    profiles:
      - transmission
      - media
  slskd:
    container_name: slskd
    environment:
      - SLSKD_SLSK_USERNAME=${SOULSEEK_USERNAME}
      - SLSKD_SLSK_PASSWORD=${SOULSEEK_PASSWORD}
      - SLSKD_USERNAME=${SLSKD_WEB_USERNAME}
      - SLSKD_PASSWORD=${SLSKD_WEB_PASSWORD}
      - SLSKD_REMOTE_CONFIGURATION=true
      - SLSKD_INCOMPLETE_DIR=/incomplete
      - SLSKD_DOWNLOADS_DIR=/music
      - SLSKD_SHARED_DIR=/music
    ports:
      - 5030:5030/tcp
      - 5031:5031/tcp
      - 50300:50300/tcp
    volumes:
      - /docker/volumes/slskd:/app:rw
      - /docker/volumes/media/finished/music:/music:rw
      - /docker/volumes/media/pending:/incomplete:rw
    restart: unless-stopped
    image: slskd/slskd:0.26.1
    profiles:
      - soulseek
      - media
